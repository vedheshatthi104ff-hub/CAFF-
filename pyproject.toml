[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caff-efficientvpr"
version = "0.1.0"
description = "Paper-based EfficientVPR reimplementation and CAFF research extension"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "torchvision>=0.16", "Pillow>=10.0", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

